name: Send WhatsApp Once

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Action mode"
        required: true
        default: "send"
        type: choice
        options:
          - send
          - list-groups
      jobId:
        description: "Unique job ID from admin API"
        required: false
        default: "manual"
        type: string
      sessionId:
        description: "Baileys auth session ID stored in NeonDB"
        required: true
        default: "main"
        type: string
      targetEnv:
        description: "GitHub environment name for WA secrets"
        required: true
        default: "development"
        type: string
      chatId:
        description: "WhatsApp chat or group ID. Required for send mode."
        required: false
        type: string
      message:
        description: "Message text to send. Required for send mode."
        required: false
        type: string
      period:
        description: "Report period, e.g. 2026-05"
        required: false
        type: string
      source:
        description: "Trigger source"
        required: false
        default: "admin-overview"
        type: string

concurrency:
  group: send-wa-${{ inputs.sessionId }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    environment: ${{ inputs.targetEnv }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run WhatsApp action
        env:
          NEONDB_URI: ${{ secrets.NEONDB_URI }}
          WA_MODE: ${{ inputs.mode }}
          WA_PAIR_TYPE: ${{ vars.WA_PAIR_TYPE || 'QR' }}
          WA_PHONE_NUMBER: ${{ secrets.WA_PHONE_NUMBER }}
          WA_JOB_ID: ${{ inputs.jobId }}
          WA_SESSION_ID: ${{ inputs.sessionId }}
          WA_CHAT_ID: ${{ inputs.chatId }}
          WA_MESSAGE_TEXT: ${{ inputs.message }}
          WA_PERIOD: ${{ inputs.period }}
          WA_SOURCE: ${{ inputs.source }}
          WA_CONNECT_TIMEOUT_MS: 180000
        run: node scripts/send-wa-once.mjs