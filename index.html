<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name="color-scheme" content="light dark">
<title>Uang Kas Amarta Residence (Blok E)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   DESIGN SYSTEM
========================= */

:root{
--font-base:clamp(14px,1.4vw,16px);
--font-small:13px;
--font-large:22px;

--radius:12px;
--radius-sm:8px;

--shadow-xs:0 1px 2px rgba(0,0,0,.04);
--shadow-sm:0 4px 12px rgba(0,0,0,.06);
--shadow-md:0 12px 32px rgba(0,0,0,.08);

--primary:#2563eb;
--success:#16a34a;
--danger:#dc2626;

--bg:#f4f6f9;
--text:#1e293b;
--text-muted:#64748b;
--surface:#ffffff;
--border:#e2e8f0;
}

/* =========================
   BASE
========================= */

body{
font-family:'Inter',sans-serif;
padding:28px;
max-width:1100px;
margin:0 auto;
background:var(--bg);
color:var(--text);
line-height:1.55;
font-size:var(--font-base);
letter-spacing:.2px;
}

h2{
font-size:var(--font-large);
font-weight:700;
margin-bottom:22px;
}

/* =========================
   TAB
========================= */

.tab{
display:flex;
gap:6px;
background:var(--surface);
padding:6px;
border-radius:var(--radius);
box-shadow:var(--shadow-xs);
margin-bottom:26px;
}

.tab button{
flex:1;
background:transparent;
border:none;
padding:10px 18px;
border-radius:var(--radius-sm);
font-weight:500;
cursor:pointer;
transition:.2s;
}

.tab button:hover{
background:#f1f5f9;
}

.tab button.active{
background:var(--primary);
color:white;
box-shadow:var(--shadow-xs);
}

/* =========================
   FORM
========================= */

label{
font-size:var(--font-small);
color:var(--text-muted);
}

input,select{
padding:10px 12px;
border-radius:var(--radius-sm);
border:1px solid var(--border);
font-size:var(--font-base);
width:100%;
box-sizing:border-box;
margin-top:6px;
background:white;
transition:.2s;
}

input:focus,select:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

/* =========================
   PAYMENT GRID
========================= */

.pay-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:16px;
margin-top:18px;
}

.pay-item{
padding:18px;
border-radius:var(--radius);
background:var(--surface);
box-shadow:var(--shadow-sm);
border:1px solid rgba(0,0,0,.04);
transition:.2s ease;
}

.pay-item:hover{
transform:translateY(-3px);
box-shadow:var(--shadow-md);
}

/* =========================
   SUMMARY KPI
========================= */

.summary{
display:flex;
gap:16px;
margin:26px 0;
flex-wrap:wrap;
}

.summary-item{
background:var(--surface);
padding:16px 18px;
border-radius:var(--radius);
box-shadow:var(--shadow-xs);
min-width:160px;
}

.summary-label{
font-size:var(--font-small);
color:var(--text-muted);
}

.summary-value{
font-size:20px;
font-weight:600;
margin-top:4px;
}

.sum-inc{color:var(--success);}
.sum-exp{color:var(--danger);}
.sum-net{color:var(--primary);}

/* =========================
   TABLE
========================= */

.table-container{
overflow-x:auto;
border-radius:var(--radius);
background:var(--surface);
box-shadow:var(--shadow-sm);
margin-top:14px;
}

table{
min-width:100%;
border-collapse:collapse;
white-space:nowrap;
}

th,td{
padding:14px 16px;
border-bottom:1px solid var(--border);
text-align:left;
}

th{
font-size:12px;
text-transform:uppercase;
letter-spacing:.6px;
color:var(--text-muted);
font-weight:600;
background:var(--surface);
}

td{
font-weight:500;
}

.badge{
padding:5px 10px;
border-radius:999px;
color:white;
font-size:12px;
font-weight:600;
}

.income{background:var(--success);}
.expense{background:var(--danger);}

/* =========================
   INSIGHT CARD
========================= */

.insight-card{
background:var(--surface);
padding:18px;
border-radius:var(--radius);
box-shadow:var(--shadow-sm);
margin-bottom:14px;
transition:.2s;
}

.insight-card:hover{
transform:translateY(-3px);
box-shadow:var(--shadow-md);
}

/* =========================
   PAGINATION
========================= */

#paginationPay,#paginationInsight{
display:flex;
gap:14px;
align-items:center;
justify-content:center;
margin-top:20px;
}

button{
padding:8px 16px;
border-radius:var(--radius-sm);
border:1px solid var(--border);
background:white;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#f1f5f9;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

/* =========================
   LOADER
========================= */

.action-loader{
position:fixed;
inset:0;
background:rgba(15,23,42,.35);
backdrop-filter:blur(12px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.25s;
}

.action-loader.show{
opacity:1;
pointer-events:auto;
}

.loader-card{
background:var(--surface);
padding:26px;
border-radius:var(--radius);
box-shadow:var(--shadow-md);
}

.loader-icon span{
width:6px;
height:18px;
background:var(--primary);
border-radius:6px;
animation:pulse 1s infinite ease-in-out;
display:inline-block;
margin-right:4px;
}

@keyframes pulse{
0%,100%{transform:scaleY(.4);opacity:.5}
50%{transform:scaleY(1);opacity:1}
}

/* =========================
   DARK MODE
========================= */

@media (prefers-color-scheme: dark){
:root{
--bg:#0f172a;
--surface:#1e293b;
--text:#e2e8f0;
--text-muted:#94a3b8;
--border:#334155;
}
input,select{background:#1e293b;color:#e2e8f0;}
button{background:#1e293b;color:#e2e8f0;border-color:#334155;}
button:hover{background:#334155;}
}

/* ========================= */

.hidden{display:none;}
.cashflow-body{max-height:480px;overflow-y:auto;}
html,body{overflow-x:hidden;}

</style>
</head>
<body>

<h2>Uang Kas Amarta Residence (Blok E)</h2>

<div class='tab'>
<button onclick='tab("payment")' id='btnPay' class='active'>Payment</button>
<button onclick='tab("cashflow")' id='btnCash'>Cashflow</button>
<button onclick='tab("insight")' id='btnInsight'>Insight</button>
</div>

<div id='payment'>
<label>Pilih Periode:</label>
<select id='periodSelect' onchange='renderPayment()'></select>
<div id='payGrid' class='pay-grid'></div>
<div id='paginationPay'></div>
</div>

<div id='cashflow' class='hidden'>
<input id='search' placeholder='search note...' oninput='onSearch()'>
<div id='summary' class='summary'>
  <div class='summary-item'><span class='summary-label'>Income</span><span id='sumInc' class='summary-value sum-inc'>Rp -</span></div>
  <div class='summary-item'><span class='summary-label'>Expense</span><span id='sumExp' class='summary-value sum-exp'>Rp -</span></div>
  <div class='summary-item'><span class='summary-label'>Net</span><span id='sumNet' class='summary-value sum-net'>Rp -</span></div>
</div>

<div class='table-container cashflow-body'>
<table>
<thead>
<tr>
<th>Date</th><th>Type</th><th>Amount</th><th>Note</th>
</tr>
</thead>
<tbody id='cashList'></tbody>
</table>
</div>
</div>

<div id='insight' class='hidden'>
<h3>Laporan Tunggakan Saat ini</h3>
<div id='insightList'></div>
<div id='paginationInsight'></div>
</div>

<div id="actionLoader" class="action-loader">
  <div class="loader-card">
    <div class="loader-row">
      <div class="loader-icon">
        <span></span><span></span><span></span>
      </div>
      <div id="loaderText" class="loader-text">Processing…</div>
    </div>
  </div>
</div>

<script>
function showLoader(text = "Processing…") {
  const el = document.getElementById("actionLoader");
  document.getElementById("loaderText").innerHTML = text;
  el.classList.add("show");
}

function hideLoader(delay = 0) {
  setTimeout(() => {
    document.getElementById("actionLoader")?.classList.remove("show");
  }, delay);
}
</script>
  
<script>
/* ==== CONFIG URL ==== */
const FETCH_URL = "https://n8n-jwskbckc.ap-southeast-1.clawcloudrun.com/webhook/cashflow"; // <= URL WEBHOOK/SOURCE

/* ==== STATE ==== */
let payments=[], cashflows=[], persons=[], periods=[];
let term='', pagePay=1,pageInsight=1,perPagePay=9,perPageInsight=6,loaded=20,chunk=20;

/* ==== INIT ==== */
async function load(){
  try {
    showLoader("Loading data from server…");

    const res = await fetch(FETCH_URL);
    if (!res.ok) throw new Error("Failed to load data");
    const data = await res.json();
    payments = data.payments;
    cashflows = data.cashflows;
    persons = data.persons;
    periods = data.periods;

    initUI();
  } catch (err) {
    hideLoader();
    alert(err.message); // atau Swal error jika nanti mau
    return;
  }

  hideLoader(300);
  }

function initUI(){
  periodSelect.innerHTML=periods.map(p=>`<option>${p}</option>`).join('');
  renderPayment(); renderCashflow(); renderInsight(); autofill();
}

/* ==== PAYMENT ==== */
function renderPayment(){
  const per=periodSelect.value;
  const list=persons.map(p=>{
    let paid = false;
    let notApplicable = false;
    if (p.join_periode && per < p.join_periode) {
      notApplicable = true;
    } else {
      paid = payments.some(pay =>
        pay.person_id === p.id && pay.period === per
                          );
    }
    return{house:p.house,paid,notApplicable};
  }).sort((a, b) => a.house.localeCompare(b.house, undefined, { numeric: true }));
  const total=Math.max(1,Math.ceil(list.length/perPagePay));
  if(pagePay>total)pagePay=total;
  const paged=list.slice((pagePay-1)*perPagePay,(pagePay-1)*perPagePay+perPagePay);
  payGrid.innerHTML=paged.map(p=>`<div class='pay-item'><div style='display:flex;justify-content:space-between'><span>${p.house}</span><span style='font-weight:700;color:${p.notApplicable ? "#6c757d" : p.paid ? "#28a745" : "#dc3545"}'>${p.notApplicable ? "Belum Bergabung" : p.paid ? "Sudah Bayar" : "Belum Bayar"}</span></div></div>`).join('');
  paginationPay.innerHTML=`<button ${pagePay===1?"disabled":""} onclick='pagePay--;renderPayment()'>Prev</button><span>Page ${pagePay}/${total}</span><button ${pagePay===total?"disabled":""} onclick='pagePay++;renderPayment()'>Next</button>`;
}

/* ==== CASHFLOW ==== */
function onSearch(){term=search.value.toLowerCase();loaded=chunk;renderCashflow();autofill();}
function format(n){return 'Rp'+Number(n).toLocaleString('id-ID');}
function renderCashflow(){
  const filtered=cashflows.filter(c=>(c.note||"").toLowerCase().includes(term));
  let inc=0,exp=0;cashflows.forEach(c=>c.type==='income'?inc+=c.amount:exp+=c.amount);
  sumInc.innerText=format(inc);sumExp.innerText=format(exp);sumNet.innerText=format(inc-exp);
  const sliced=filtered.slice(0,loaded);
  cashList.innerHTML=sliced.map(c=>`<tr><td>${c.date||"-"}</td><td><span class='badge ${c.type}'>${c.type}</span></td><td>${format(c.amount)}</td><td>${c.note||"-"}</td></tr>`).join('');
}
function autofill(){
  requestAnimationFrame(()=>{
    const box=document.querySelector('.cashflow-body');
    if(!box)return;
    const filtered=cashflows.filter(c=>(c.note||"").toLowerCase().includes(term));
    if(box.scrollHeight<=box.clientHeight && loaded<filtered.length){
      loaded+=chunk;renderCashflow();autofill();
    }
  });
}
setTimeout(()=>{
  const box=document.querySelector('.cashflow-body');
  if(!box)return;
  box.addEventListener('scroll',()=>{if(box.scrollTop+box.clientHeight>=box.scrollHeight-1){loaded+=chunk;renderCashflow();}});
},0);

/* ==== INSIGHT ==== */
function renderInsight(){
  const result=persons.map(p=>{
    const validPeriods = periods.filter(pr => {
      if (!p.join_periode) return true; // kalau kosong, anggap semua berlaku
      return pr >= p.join_periode;
    });
    const paid = payments
      .filter(pay => pay.person_id === p.id)
      .map(pay => pay.period);
    const unpaid = validPeriods.filter(pr => !paid.includes(pr));
    return{house:p.house,name:p.name,unpaid,jumlah:unpaid.length};
  }).filter(r=>r.jumlah>=1).sort((a,b)=>b.jumlah-a.jumlah);
  if(!result.length){insightList.innerHTML="Tidak ada tunggakan";paginationInsight.innerHTML="";return;}
  const total=Math.max(1,Math.ceil(result.length/perPageInsight));
  if(pageInsight>total)pageInsight=total;
  const start=(pageInsight-1)*perPageInsight;
  const paged=result.slice(start,start+perPageInsight);
  insightList.innerHTML=paged.map((r,i)=>`<div class='insight-card'><b>${(start+i)+1}. ${r.house}</b><div>&bull; Nunggak: ${r.jumlah} periode</div><div>&bull; Periode: ${r.unpaid.join(", ")}</div></div>`).join('');
  paginationInsight.innerHTML=`<button ${pageInsight===1?"disabled":""} onclick='pageInsight--;renderInsight()'>Prev</button><span>Page ${pageInsight}/${total}</span><button ${pageInsight===total?"disabled":""} onclick='pageInsight++;renderInsight()'>Next</button>`;
}

/* ==== TAB ==== */
function tab(m){
    payment.classList.toggle('hidden',m!=='payment');
    cashflow.classList.toggle('hidden',m!=='cashflow');
    insight.classList.toggle('hidden',m!=='insight');
    btnPay.classList.toggle('active',m==='payment');
    btnCash.classList.toggle('active',m==='cashflow');
    btnInsight.classList.toggle('active',m==='insight');
    if(m==='insight')renderInsight();
}
load();
</script>
</body>
</html>
